{% extends 'base.html' %}

{% block title %}Кликер{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-gradient-primary text-white p-4 text-center">
                <h2 class="mb-0"><i class="bi bi-hand-index-thumb"></i> Кликер</h2>
            </div>
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <span class="badge fs-3 px-4 py-2" style="background-color: #C0C0C0; color: #000;">
                        <i class="bi bi-star-fill"></i> <span id="scoreDisplay">0</span>
                    </span>
                </div>

                <button id="clickButton" class="btn btn-success btn-lg rounded-circle mb-4" style="width: 180px; height: 180px; font-size: 1.5rem;">
                    <i class="bi bi-hand-index-thumb-fill display-3"></i><br>КЛИКАЙ
                </button>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body">
                                <h6>Сила клика</h6>
                                <span id="clickPower" class="fs-5 fw-bold">1</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body">
                                <h6>Авто-клики</h6>
                                <span id="autoClickPower" class="fs-5 fw-bold">0</span>/сек
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body">
                                <h6>Формат чисел</h6>
                                <select id="formatSelect" class="form-select form-select-sm">
                                    <option value="normal">Обычная нотация</option>
                                    <option value="scientific">Научная нотация</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <hr>
                <h5 class="mb-3">Улучшения</h5>

                <div class="d-grid gap-2">
                    <button id="upgradeClickBtn" class="btn btn-primary" onclick="buyUpgrade('click')">
                        Усилить клик (+1) — <span id="clickPrice">10</span> очков
                    </button>
                    <button id="upgradeAutoBtn" class="btn btn-purple" onclick="buyUpgrade('auto')">
                        Авто-клик (+1/сек) — <span id="autoPrice">50</span> очков
                    </button>
                    <button id="superUpgradeBtn" class="btn btn-warning" onclick="buyUpgrade('super')">
                        СУПЕР УЛУЧШЕНИЕ (+5) — <span id="superPrice">200</span> очков
                    </button>
                </div>

                <button id="convertBtn" class="btn btn-secondary mt-4" onclick="convertPoints()">
                    <i class="bi bi-arrow-left-right"></i> Конвертировать в баллы
                </button>
                <div class="mt-2">
                    <small class="text-muted">Осталось конвертаций сегодня: <span id="convertsLeft">5</span></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let numberFormat = 'normal';

function formatNumber(num) {
    if (numberFormat === 'scientific' && num >= 1000) {
        return num.toExponential(2);
    }
    return num.toLocaleString('ru-RU');
}

function updateUI(data) {
    document.getElementById('scoreDisplay').textContent = formatNumber(data.clicker_points);
    document.getElementById('clickPower').textContent = formatNumber(data.click_power);
    document.getElementById('autoClickPower').textContent = formatNumber(data.auto_click_power);
    document.getElementById('clickPrice').textContent = formatNumber(data.click_price);
    document.getElementById('autoPrice').textContent = formatNumber(data.auto_price);
    document.getElementById('superPrice').textContent = formatNumber(data.super_price);
    document.getElementById('convertsLeft').textContent = data.converts_left;

    document.getElementById('upgradeClickBtn').disabled = data.clicker_points < data.click_price;
    document.getElementById('upgradeAutoBtn').disabled = data.clicker_points < data.auto_price;
    document.getElementById('superUpgradeBtn').disabled = data.clicker_points < data.super_price;
    document.getElementById('convertBtn').disabled = data.clicker_points <= 0 || data.converts_left <= 0;

    if (data.clicker_points > 0 && data.converts_left > 0) {
        let converted = Math.floor(Math.log(data.clicker_points) / Math.log(3));
        document.getElementById('convertBtn').innerHTML = '<i class="bi bi-arrow-left-right"></i> Конвертировать в баллы (~' + formatNumber(converted) + ' баллов)';
    } else if (data.converts_left <= 0) {
        document.getElementById('convertBtn').innerHTML = '<i class="bi bi-arrow-left-right"></i> Конвертировать в баллы (лимит исчерпан)';
    } else {
        document.getElementById('convertBtn').innerHTML = '<i class="bi bi-arrow-left-right"></i> Конвертировать в баллы';
    }
}

document.getElementById('clickButton').addEventListener('click', async () => {
    const resp = await fetch('/clicker/click', { method: 'POST' });
    const data = await resp.json();
    updateUI(data);
});

async function buyUpgrade(type) {
    const resp = await fetch('/clicker/upgrade', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ upgrade_type: type })
    });
    const data = await resp.json();
    if (data.error) {
        alert(data.error);
    } else {
        updateUI(data);
    }
}

async function convertPoints() {
    const resp = await fetch('/clicker/convert', { method: 'POST' });
    const data = await resp.json();
    if (data.error) {
        alert(data.error);
    } else {
        updateUI(data);
        location.reload();
    }
}

document.getElementById('formatSelect').addEventListener('change', function() {
    numberFormat = this.value;
    fetch('/clicker/state').then(r => r.json()).then(updateUI);
});

setInterval(async () => {
    const resp = await fetch('/clicker/state');
    const data = await resp.json();
    updateUI(data);
}, 1000);

fetch('/clicker/state').then(r => r.json()).then(updateUI);
</script>

<style>
.btn-purple {
    background-color: #9C27B0;
    color: white;
}
.btn-purple:hover {
    background-color: #7B1FA2;
    color: white;
}
#clickButton {
    transition: transform 0.1s;
}
#clickButton:active {
    transform: scale(0.9);
}
</style>
{% endblock %}
