{% extends 'base.html' %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold text-primary">404</h1>
    <h2 class="mb-4">Страница не найдена</h2>
    <p class="lead text-muted">Извините, запрашиваемая страница не существует.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg mt-3">
        <i class="bi bi-house-door"></i> На главную
    </a>
</div>
{% endblock %}
